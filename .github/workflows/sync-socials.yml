name: Sync Socials from Google Sheet

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Auto-Sync Badges with Automated Brand Colors
        run: |
          python - << 'EOF'
          import urllib.request
          import urllib.parse
          import json
          import re
          import csv
          import io

          CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vStbIGp4hG8YGuvBZkViGlXIVCoQZZRq7RXkg-0Aky9jSbbL6ZSuDF2hzK7EtT8fh6krc8FxJP1B99-/pub?gid=0&single=true&output=csv"
          COLORS_URL = "https://raw.githubusercontent.com/simple-icons/simple-icons/develop/data/simple-icons.json"

          # 1. Fetch official brand color dataset automatically (3,400+ platforms)
          color_map = {'linkedin': '0077B5'}
          try:
              req = urllib.request.Request(COLORS_URL, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req) as resp:
                  icons_data = json.loads(resp.read().decode('utf-8'))
                  for ic in icons_data:
                      slug = ic.get('slug') or re.sub(r'[^a-z0-9]', '', ic['title'].lower())
                      color_map[slug] = ic['hex']
          except Exception as e:
              print("Warning: Could not fetch remote color dataset:", e)

          # 2. Fetch live Google Sheet CSV
          req = urllib.request.Request(CSV_URL, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req) as resp:
              csv_text = resp.read().decode('utf-8')

          reader = csv.reader(io.StringIO(csv_text))
          badges = []

          for row in reader:
              if not row:
                  continue
              plat = row[0].strip()
              url = row[1].strip() if len(row) > 1 else ""
              custom_col = row[2].strip() if len(row) > 2 else ""

              norm_key = re.sub(r'[^a-z0-9]', '', plat.lower())

              # STOP immediately when reaching FIXED PAGE LINKS divider
              if 'fixed' in norm_key:
                  break
              if not norm_key or not url or norm_key in {'platform', 'name', 'key'}:
                  continue
              if not re.match(r'^https?://', url, re.I):
                  continue

              # Auto-detect brand color from the dataset (or use custom hex from Column C if given)
              if custom_col and re.match(r'^[a-fA-F0-9]{6}$', custom_col):
                  color = custom_col
              else:
                  color = color_map.get(norm_key, '0D1117')

              safe_plat = urllib.parse.quote(plat)
              badge_url = f"https://img.shields.io/badge/{safe_plat}-{color}?style=for-the-badge&logo={norm_key}&logoColor=white"

              badges.append(
                  f'<a href="{url}" target="_blank">\n'
                  f'  <img src="{badge_url}" alt="{plat}" style="margin-right: 5px; margin-bottom: 5px;" />\n'
                  f'</a>'
              )

          new_html = '\n<p align="center">\n' + '\n'.join(badges) + '\n</p>\n'

          # Update README.md between the comment markers
          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          pattern = r'(<!-- START_SOCIAL -->)[\s\S]*?(<!-- END_SOCIAL -->)'
          if re.search(pattern, readme):
              updated_readme = re.sub(pattern, f'\\1{new_html}\\2', readme)
              with open("README.md", "w", encoding="utf-8") as f:
                  f.write(updated_readme)
              print(f"Successfully generated {len(badges)} Shields.io badges with auto brand colors!")
          else:
              print("Markers <!-- START_SOCIAL --> and <!-- END_SOCIAL --> not found.")
          EOF

      - name: Commit and Push If Changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes in social badges."
          else
            git commit -m "Auto-sync profile badges with official brand colors"
            git push
          fi
